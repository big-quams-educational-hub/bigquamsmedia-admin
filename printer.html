<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BQM Card Printer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a3fa8;--blue-dk:#0e2470;--blue-lt:#dbeafe;
  --orange:#f97316;--border:#e2e8f0;
  --text:#0f172a;--muted:#64748b;--bg:#f1f5f9;--card:#fff;
}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
.topbar{background:linear-gradient(135deg,var(--blue-dk),var(--blue));padding:0 28px;height:62px;display:flex;align-items:center;gap:14px;box-shadow:0 3px 20px rgba(0,0,0,.28)}
.tb-logo{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--orange);overflow:hidden;flex-shrink:0;background:#fff}
.tb-logo img{width:100%;height:100%;object-fit:cover;display:block}
.tb-title{color:#fff;font-weight:800;font-size:.92rem;letter-spacing:.2px}
.tb-sub{color:#93c5fd;font-size:.63rem;font-weight:500;display:block;margin-top:1px}
.tb-badge{margin-left:auto;background:rgba(249,115,22,.2);border:1px solid rgba(249,115,22,.45);color:#fed7aa;font-size:.63rem;font-weight:700;padding:5px 14px;border-radius:20px;letter-spacing:.5px}
.page{max-width:560px;margin:0 auto;padding:32px 20px 80px}
.status{padding:13px 16px;border-radius:10px;font-size:.84rem;font-weight:600;margin-bottom:18px;display:none;align-items:center;gap:8px}
.status.show{display:flex}
.status.error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.status.success{background:#dcfce7;color:#14532d;border:1px solid #86efac}
.section-lbl{font-size:.67rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.exam-btn{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px 10px 14px;cursor:pointer;text-align:center;transition:.18s;user-select:none}
.exam-btn:hover{border-color:var(--blue);background:var(--blue-lt)}
.exam-btn.active.waec{border-color:#c0392b;background:#fff5f5;box-shadow:0 0 0 3px rgba(192,57,43,.12)}
.exam-btn.active.neco-token{border-color:#15803d;background:#f0fdf4;box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.exam-btn.active.neco-ev{border-color:#6d28d9;background:#faf5ff;box-shadow:0 0 0 3px rgba(109,40,217,.12)}
.exam-ico{font-size:1.5rem;margin-bottom:8px}
.exam-name{font-weight:800;font-size:.82rem;color:var(--text);line-height:1.3}
.exam-sub{font-size:.66rem;color:var(--muted);margin-top:3px}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 22px;box-shadow:0 2px 16px rgba(0,0,0,.07);display:none;margin-bottom:28px}
.form-card.show{display:block}
.form-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.form-head-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.form-head h2{font-size:1rem;font-weight:800;color:var(--text)}
.form-head p{font-size:.72rem;color:var(--muted);margin-top:2px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.7rem;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.field input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;font-family:'Inter',sans-serif;color:var(--text);background:#fafbfc;transition:.18s;letter-spacing:.5px}
.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,63,168,.1);background:#fff}
.field input::placeholder{color:#bbc5d4;font-size:.9rem;letter-spacing:0}
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn{padding:13px 22px;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-weight:700;font-size:.88rem;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn-primary{background:linear-gradient(135deg,var(--blue-dk),var(--blue));color:#fff;flex:1}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(26,63,168,.32)}
.btn-clear{background:var(--bg);color:var(--muted);border:1px solid var(--border);padding:13px 18px}
.btn-clear:hover{background:var(--border)}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo">
    <img src="https://bigquamsmedia.com.ng/file_000000000370724698997662ddbee6b5.png" alt="BQM">
  </div>
  <div>
    <div class="tb-title">BIG QUAMS MEDIA®</div>
    <span class="tb-sub">Simplifying campus life for every student</span>
  </div>
  <div class="tb-badge">ADMIN ONLY</div>
</div>

<div class="page">
  <div class="status" id="statusBar"></div>

  <div class="section-lbl">Select Card Type</div>
  <div class="exam-grid">
    <div class="exam-btn waec" id="btn-waec" onclick="selectType('waec')">
      <div class="exam-ico">📋</div>
      <div class="exam-name">WAEC</div>
      <div class="exam-sub">Scratch Card</div>
    </div>
    <div class="exam-btn neco-token" id="btn-neco-token" onclick="selectType('neco-token')">
      <div class="exam-ico">🔑</div>
      <div class="exam-name">NECO Token</div>
      <div class="exam-sub">Result Checking</div>
    </div>
    <div class="exam-btn neco-ev" id="btn-neco-ev" onclick="selectType('neco-ev')">
      <div class="exam-ico">✅</div>
      <div class="exam-name">NECO e-Verify</div>
      <div class="exam-sub">e-Verification PIN</div>
    </div>
  </div>

  <div class="form-card" id="formCard">
    <div class="form-head">
      <div class="form-head-ico" id="formIco"></div>
      <div>
        <h2 id="formTitle">Card Details</h2>
        <p id="formSub">Enter the details below</p>
      </div>
    </div>
    <div id="fieldSerial" class="field" style="display:none">
      <label>Serial Number</label>
      <input type="text" id="inSerial" placeholder="e.g. WRN250485594" autocomplete="off">
    </div>
    <div class="field">
      <label id="pinLabel">PIN</label>
      <input type="text" id="inPin" placeholder="Enter PIN" autocomplete="off">
    </div>
    <div class="btn-row">
      <button class="btn btn-clear" onclick="clearForm()">Clear</button>
      <button class="btn btn-primary" onclick="generatePDF()">⬇ Download PDF</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const { jsPDF } = window.jspdf;
let activeType = null;
let logoDataUrl = null;

(function(){
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function(){
    const c = document.createElement('canvas');
    c.width=200; c.height=200;
    const ctx=c.getContext('2d');
    ctx.beginPath(); ctx.arc(100,100,100,0,Math.PI*2); ctx.clip();
    ctx.drawImage(img,0,0,200,200);
    logoDataUrl=c.toDataURL('image/png');
  };
  img.src='https://bigquamsmedia.com.ng/file_000000000370724698997662ddbee6b5.png';
})();

function selectType(type){
  activeType=type;
  document.querySelectorAll('.exam-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+type).classList.add('active');
  document.getElementById('formCard').classList.add('show');
  const ico=document.getElementById('formIco');
  const fieldSerial=document.getElementById('fieldSerial');
  if(type==='waec'){
    ico.textContent='📋'; ico.style.background='#fff5f5';
    document.getElementById('formTitle').textContent='WAEC Scratch Card';
    document.getElementById('formSub').textContent='Enter Serial Number and PIN';
    fieldSerial.style.display='block';
    document.getElementById('pinLabel').textContent='PIN';
  } else if(type==='neco-token'){
    ico.textContent='🔑'; ico.style.background='#f0fdf4';
    document.getElementById('formTitle').textContent='NECO Results Token';
    document.getElementById('formSub').textContent='Enter the result checking token';
    fieldSerial.style.display='none';
    document.getElementById('pinLabel').textContent='Token / PIN';
  } else {
    ico.textContent='✅'; ico.style.background='#faf5ff';
    document.getElementById('formTitle').textContent='NECO e-Verification PIN';
    document.getElementById('formSub').textContent='Enter the e-Verification PIN';
    fieldSerial.style.display='none';
    document.getElementById('pinLabel').textContent='e-Verification PIN';
  }
  clearStatus();
  document.getElementById('inPin').value='';
  document.getElementById('inSerial').value='';
}

function clearForm(){
  document.getElementById('inPin').value='';
  document.getElementById('inSerial').value='';
  clearStatus();
}

function showStatus(type,msg){
  const b=document.getElementById('statusBar');
  b.className='status show '+type;
  b.innerHTML=(type==='error'?'❌ ':'✅ ')+msg;
  if(type==='success') setTimeout(()=>b.classList.remove('show'),5000);
}
function clearStatus(){ document.getElementById('statusBar').classList.remove('show'); }

function generatePDF(){
  clearStatus();
  if(!activeType){ showStatus('error','Select a card type first.'); return; }
  const pin=document.getElementById('inPin').value.trim();
  const serial=document.getElementById('inSerial').value.trim();
  if(!pin){ showStatus('error','Enter the PIN.'); return; }
  if(activeType==='waec'&&!serial){ showStatus('error','Enter the Serial Number.'); return; }
  buildPDF(activeType,serial,pin);
}

function buildPDF(type, serial, pin){
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const PW=210, PH=297;
  const now=new Date();
  const dateStr=now.toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'});

  // ── BACKGROUND ──
  doc.setFillColor(255,255,255);
  doc.rect(0,0,PW,PH,'F');

  // ── HEADER ──
  const HH=40;
  doc.setFillColor(14,36,112);
  doc.rect(0,0,PW,HH,'F');
  doc.setFillColor(249,115,22);
  doc.rect(0,HH-2.5,PW,2.5,'F');

  // Logo
  const logoR=14, logoX=20, logoY=HH/2;
  doc.setFillColor(255,255,255);
  doc.circle(logoX,logoY,logoR+1.2,'F');
  if(logoDataUrl) doc.addImage(logoDataUrl,'PNG',logoX-logoR,logoY-logoR,logoR*2,logoR*2);

  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.setTextColor(255,255,255);
  doc.text('BIG QUAMS MEDIA\u00AE',logoX+logoR+7,logoY-3);
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.setTextColor(147,197,253);
  doc.text('Simplifying campus life for every student',logoX+logoR+7,logoY+4.5);

  doc.setFontSize(7);
  doc.setTextColor(147,197,253);
  doc.text(dateStr,PW-14,logoY+1,{align:'right'});

  // ── OUTER BORDER FRAME (BQM colours) ──
  // Blue outer frame
  doc.setDrawColor(14,36,112);
  doc.setLineWidth(3);
  doc.rect(10,HH+8,PW-20,PH-HH-8-26,'D');
  // Orange inner frame line
  doc.setDrawColor(249,115,22);
  doc.setLineWidth(1);
  doc.rect(13,HH+11,PW-26,PH-HH-11-29,'D');

  // ── CARD (back only) — centred ──
  const CW=166, CH=58;
  const CX=(PW-CW)/2;
  const CY=HH+24;
  drawBackCard(doc,type,CX,CY,CW,CH,pin,serial);

  // ── DIVIDER ──
  const divY=CY+CH+14;
  doc.setDrawColor(14,36,112);
  doc.setLineWidth(0.4);
  doc.line(18,divY,PW-18,divY);
  doc.setDrawColor(249,115,22);
  doc.setLineWidth(0.25);
  doc.line(18,divY+1.5,PW-18,divY+1.5);

  // ── HOW TO USE — two columns ──
  const howY=divY+10;
  const colW=(PW-42)/2;
  const col1X=16, col2X=16+colW+10;
  drawHowToUse(doc,col1X,howY,colW,type,serial,pin);
  // Column divider
  doc.setDrawColor(210,218,230);
  doc.setLineWidth(0.3);
  doc.line(16+colW+5,howY,16+colW+5,howY+90);
  drawHowToUse(doc,col2X,howY,colW,type,null,null);

  // ── FOOTER ──
  drawFooter(doc,PW,PH);

  const labels={waec:'WAEC',['neco-token']:'NECO-Token',['neco-ev']:'NECO-eVerify'};
  doc.save('BQM-'+labels[type]+'-'+Date.now()+'.pdf');
  showStatus('success','PDF downloaded successfully.');
}

// ═══════════════════════════════
// BACK CARD ONLY
// ═══════════════════════════════
function drawBackCard(doc,type,x,y,w,h,pin,serial){
  const r=5;

  // Shadow
  doc.setFillColor(195,205,225);
  doc.roundedRect(x+2,y+2,w,h,r,r,'F');
  // White body
  doc.setFillColor(255,255,255);
  doc.roundedRect(x,y,w,h,r,r,'F');
  doc.setDrawColor(210,220,235);
  doc.setLineWidth(0.3);
  doc.roundedRect(x,y,w,h,r,r,'D');

  // Top colour strip — matches exam type
  let sc=type==='waec'?[192,57,43]:type==='neco-token'?[16,68,38]:[38,20,90];
  let sc2=type==='waec'?[212,160,23]:type==='neco-token'?[180,140,20]:[249,115,22];
  doc.setFillColor(...sc);
  doc.roundedRect(x,y,w,9,r,r,'F');
  doc.rect(x,y+5,w,4,'F');
  // Thin accent under strip
  doc.setFillColor(...sc2);
  doc.rect(x,y+9,w,2,'F');

  // Magnetic stripe
  doc.setFillColor(30,30,30);
  doc.rect(x,y+13,w,9,'F');

  // Signature panel
  doc.setFillColor(248,249,251);
  doc.setDrawColor(210,218,228);
  doc.setLineWidth(0.22);
  doc.rect(x+7,y+25,w-14,11,'FD');
  for(let i=1;i<4;i++){
    doc.setDrawColor(200,210,225);
    doc.setLineWidth(0.15);
    doc.line(x+7,y+25+(i*2.75),x+w-7,y+25+(i*2.75));
  }
  doc.setFont('helvetica','normal');
  doc.setFontSize(5);
  doc.setTextColor(175,182,194);
  doc.text('Authorised Signature',x+10,y+33);

  // PIN detail box
  const detY=y+39;
  const detH=h-39-4;
  doc.setFillColor(248,251,255);
  doc.setDrawColor(210,228,250);
  doc.setLineWidth(0.35);
  doc.roundedRect(x+7,detY,w-14,detH,2,2,'FD');

  // Left accent bar
  doc.setFillColor(...sc);
  doc.rect(x+7,detY,3,detH,'F');

  const ix=x+14;
  let iy=detY+8;

  if(type==='waec'){
    // Serial
    doc.setFont('helvetica','bold');
    doc.setFontSize(6);
    doc.setTextColor(100,116,139);
    doc.text('SERIAL NUMBER',ix,iy);
    iy+=5.5;
    doc.setFont('courier','bold');
    doc.setFontSize(12.5);
    doc.setTextColor(10,30,90);
    doc.text(serial,ix,iy);
    // divider
    iy+=2.5;
    doc.setDrawColor(210,225,245);
    doc.setLineWidth(0.22);
    doc.line(ix,iy+1,x+w-10,iy+1);
    iy+=6;
    // PIN
    doc.setFont('helvetica','bold');
    doc.setFontSize(6);
    doc.setTextColor(100,116,139);
    doc.text('PIN',ix,iy);
    iy+=5.5;
    doc.setFont('courier','bold');
    doc.setFontSize(12.5);
    doc.setTextColor(10,30,90);
    doc.text(pin,ix,iy);
  } else {
    const heading=type==='neco-token'?'NECO TOKEN':'NECO E-VERIFICATION PIN';
    doc.setFont('helvetica','bold');
    doc.setFontSize(6.5);
    doc.setTextColor(100,116,139);
    doc.text(heading,ix,iy);
    iy+=8;
    doc.setFont('courier','bold');
    doc.setFontSize(16);
    doc.setTextColor(...sc);
    doc.text(pin,ix,iy);
  }

  // BACK label
  doc.setFont('helvetica','bold');
  doc.setFontSize(5.5);
  doc.setTextColor(165,172,184);
  doc.text('BACK',x+w-9,y+h-3,{align:'right'});

  // Exam badge — top left of card strip
  doc.setFont('helvetica','bold');
  doc.setFontSize(7.5);
  doc.setTextColor(255,255,255);
  const badgeLabel=type==='waec'?'WAEC':type==='neco-token'?'NECO TOKEN':'NECO e-VERIFY';
  doc.text(badgeLabel,x+8,y+6.5);
}

// ═══════════════════════════════
// HOW TO USE
// ═══════════════════════════════
function drawHowToUse(doc,x,y,w,type,serial,pin){
  // Dashed border box
  doc.setDrawColor(175,188,205);
  doc.setLineDashPattern([1.8,1.8],0);
  doc.setLineWidth(0.4);
  doc.rect(x,y,w,90,'D');
  doc.setLineDashPattern([],0);

  // Corner marks
  const mk=4;
  [[x,y,1,1],[x+w,y,-1,1],[x,y+90,1,-1],[x+w,y+90,-1,-1]].forEach(([cx,cy,dx,dy])=>{
    doc.setDrawColor(120,138,165);
    doc.setLineWidth(0.5);
    doc.line(cx,cy,cx+mk*dx,cy);
    doc.line(cx,cy,cx,cy+mk*dy);
  });

  let iy=y+9;

  // Title
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.setTextColor(15,23,42);
  doc.text('HOW TO USE CARD',x+w/2,iy,{align:'center'});
  iy+=4;
  doc.setDrawColor(14,36,112);
  doc.setLineWidth(0.55);
  doc.line(x+8,iy,x+w-8,iy);
  iy+=8;

  // Steps
  const steps=type==='waec'
    ?['Scratch off the covered area to reveal your PIN','Enter Pin and Serial Number where required']
    :['No scratch needed — PIN is printed below','Enter the PIN where required on the portal'];

  steps.forEach((s,i)=>{
    doc.setFillColor(14,36,112);
    doc.circle(x+9,iy-1.5,3.2,'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(6.5);
    doc.setTextColor(255,255,255);
    doc.text(String(i+1),x+9,iy-0.2,{align:'center'});
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.5);
    doc.setTextColor(28,38,58);
    doc.text(s,x+15,iy,{maxWidth:w-19});
    iy+=11;
  });

  iy+=2;

  // PIN/Serial display (left column only)
  if(serial||pin){
    doc.setFont('helvetica','bold');
    doc.setFontSize(10);
    doc.setTextColor(15,23,42);
    if(serial){
      doc.text('Serial: '+serial,x+7,iy);
      iy+=9;
    }
    if(pin){
      const lbl=activeType==='neco-token'?'Token: ':activeType==='neco-ev'?'PIN: ':'PIN: ';
      doc.text(lbl+pin,x+7,iy);
      iy+=10;
    }
  } else {
    iy+=19;
  }

  // Divider
  doc.setDrawColor(200,212,228);
  doc.setLineWidth(0.28);
  doc.line(x+7,iy,x+w-7,iy);
  iy+=7;

  // Disclaimer
  doc.setFont('helvetica','bold');
  doc.setFontSize(6.5);
  doc.setTextColor(28,38,58);
  doc.text('Disclaimer:',x+7,iy);
  iy+=5.5;
  doc.setFont('helvetica','normal');
  doc.setFontSize(6);
  doc.setTextColor(75,88,110);
  const disc='This scratch card is not the property of BIG QUAMS MEDIA. It is issued by the relevant examination body (such as WAEC, NECO, NABTEB, NBAIS, or other authorised bodies). BIG QUAMS MEDIA acts only as a distributor and is not responsible for the conduct, administration, or results of the examination.';
  doc.text(doc.splitTextToSize(disc,w-14),x+7,iy);
}

// ═══════════════════════════════
// FOOTER
// ═══════════════════════════════
function drawFooter(doc,PW,PH){
  const fh=24, fy=PH-fh;
  doc.setFillColor(14,36,112);
  doc.rect(0,fy,PW,fh,'F');
  doc.setFillColor(249,115,22);
  doc.rect(0,fy,PW,2.5,'F');

  if(logoDataUrl){
    doc.setFillColor(255,255,255);
    doc.circle(21,fy+12,7.5,'F');
    doc.addImage(logoDataUrl,'PNG',13.5,fy+4.5,15,15);
  }

  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.setTextColor(255,255,255);
  doc.text('BIG QUAMS MEDIA\u00AE',33,fy+10.5);
  doc.setFont('helvetica','normal');
  doc.setFontSize(6.5);
  doc.setTextColor(147,197,253);
  doc.text('Simplifying campus life for every student',33,fy+17);

  doc.setFont('helvetica','normal');
  doc.setFontSize(7);
  doc.setTextColor(253,186,116);
  doc.text('WhatsApp: +2349049871643  ||  www.bigquamsmedia.com.ng  ||  @bigquamsmedia',PW-14,fy+13,{align:'right'});
}
</script>
</body>
</html>
